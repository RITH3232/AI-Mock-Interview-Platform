server:
  port: ${PORT:5000}
  error:
    include-message: always

spring:
  application:
    name: interviewiq-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/interviewiq}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  task:
    execution:
      pool:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        keep-alive: 60s

# Application custom configurations
app:
  jwt:
    # Match the JWT_SECRET and REFRESH_TOKEN_SECRET in Node backend env
    secret: ${JWT_SECRET:interviewiq_jwt_super_secret_key_2026}
    refresh-secret: ${REFRESH_TOKEN_SECRET:interviewiq_jwt_super_refresh_secret_key_2026}
    # 1d expiration for access token to match JWT_EXPIRES_IN=1d in Express .env
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # 7d expiration for refresh token to match REFRESH_TOKEN_EXPIRES_IN=7d in Express .env
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  openai:
    api-key: ${OPENAI_API_KEY:your_openai_api_key_here}
    model: ${OPENAI_MODEL:gpt-3.5-turbo}
